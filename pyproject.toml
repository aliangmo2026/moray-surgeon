[build-system]
# PEP 639 (SPDX license expressions + license-files) landed in setuptools 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moray-surgeon"
description = "AST-based zero-hallucination code refactoring engine."
readme = "README.md"
requires-python = ">=3.11"
# Non-commercial only. Commercial licensing: 848908615@qq.com
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "libcst>=1.4",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp>=1.0.0",
    "jedi>=0.19.0",
    "pygls>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    # GitHub Issue bot: issue/PR API access for `moray-surgeon bot`.
    "PyGithub>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Architecture before/after snapshots are powered by the local moray-scribe
# checkout (pip install -e ../moray-scribe). The orchestrator degrades to an
# empty architecture diff when the package is absent.
scribe = [
    "moray-scribe>=0.1.0",
]

[project.scripts]
moray-surgeon = "moray_surgeon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# The web console ships its single-page UI as a static asset next to the
# web_server module; without this block the wheel would serve a 404 landing page.
[tool.setuptools.package-data]
moray_surgeon = ["static/*.html"]

# Single source of truth lives in moray_surgeon/__init__.py; duplicating the
# version string here would let the wheel metadata silently drift.
[tool.setuptools.dynamic]
version = { attr = "moray_surgeon.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"

# jedi ships no type information. The rename atom wraps its API behind small,
# locally typed helpers, so a stub package would add a dependency for no gain.
[[tool.mypy.overrides]]
module = "jedi"
ignore_missing_imports = true

# moray-scribe (the local architecture-snapshot engine) ships no py.typed
# marker either; the architecture module wraps its API behind typed helpers.
[[tool.mypy.overrides]]
module = "moray_scribe.*"
ignore_missing_imports = true

[tool.ruff.lint]
# S102 is selected on purpose: the differential sandbox is the one place where
# executing code is the job, and the single call site carries a noqa + threat
# model instead of hiding behind a blanket ignore.
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM", "RUF", "S102"]

# Fixture factories and helpers in tests are intentionally duck-typed; the
# typed surface is enforced on src/ only.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202"]
# Typer's declarative API takes Option/Argument objects as parameter defaults;
# B008 exists to prevent exactly that pattern elsewhere.
"src/moray_surgeon/cli.py" = ["B008"]
# build_skill.py embeds the Chinese SKILL.md manifest verbatim; its full-width
# punctuation and long table rows are the deliverable, not style violations.
"scripts/*" = ["RUF001", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# DEBT-005: a coverage gate for the whole package. __main__ is a two-line entry
# shim exercised only by `python -m`, so it is excluded rather than covered in a
# subprocess. The threshold stays below current coverage to leave refactoring
# headroom while still catching a real regression.
[tool.coverage.run]
source = ["moray_surgeon"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
# The differential sandbox runs its worker loop under a custom sys.settrace
# handler (the opcode watchdog), which by CPython's rules replaces coverage's
# tracer for that thread. The worker/tracer lines are exercised by every
# sandbox test but are physically unmeasurable while the watchdog is
# installed, so their defining lines are excluded like __main__ shims are.
exclude_lines = [
    "pragma: no cover",
    "def worker\\(\\) -> None:",
    "def tracer\\(frame: FrameType",
]

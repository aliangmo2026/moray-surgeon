# moray-surgeon autonomous refactor bot.
#
# Copy this file to .github/workflows/moray-bot.yml in the repository you want
# the bot to serve. On every newly opened issue it clones the repository, asks
# the model for a RefactorPlan, applies it with the AST engine, runs the
# verification gates and opens a pull request that closes the issue.
#
# Prerequisites (Settings -> Secrets and variables -> Actions):
#   * secret MORAY_API_KEY      model credential (not needed for local Ollama)
#   * vars   MORAY_API_TYPE     ollama (default), openai or anthropic
#   * vars   MORAY_MODEL        model name, e.g. gpt-4o-mini / claude-sonnet-4-5
#   * vars   MORAY_BASE_URL     API root, e.g. https://api.openai.com/v1
#
# Repository setting: Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests" must be enabled.
#
# Note: commits pushed with the built-in GITHUB_TOKEN do not trigger other
# workflows. If the bot's PR must run CI, push with a fine-grained PAT instead
# and store it as GITHUB_TOKEN.

name: moray-surgeon bot

on:
  issues:
    types: [opened]

permissions:
  contents: write       # clone, commit on the bot branch, push it
  issues: write         # comment diagnostics and apply the needs-human label
  pull-requests: write  # open the pull request

# One run per issue; a re-opened/edited issue must not race an older run.
concurrency:
  group: moray-bot-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  refactor:
    # The run executes the repository's own tests and changed functions, with a
    # write-scoped token. Never let an arbitrary issue author trigger that:
    # restrict the bot to owners, members and collaborators.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the workflow repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install moray-surgeon with the verification tools
        run: |
          python -m pip install --upgrade pip
          # ruff, mypy and pytest live in the [dev] extra; the bot's Verifier
          # runs all three before it pushes anything.
          pip install "moray-surgeon[dev]"
          # Not published on your index? Install from git instead:
          # pip install "moray-surgeon[dev] @ git+https://github.com/OWNER/moray-surgeon.git"

      - name: Refactor the issue into a verified pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Enterprise only; the public defaults are github.com and
          # api.github.com. Both are validated (https only, no local/private hosts).
          # GITHUB_SERVER_URL: ${{ vars.GITHUB_SERVER_URL }}
          # GITHUB_API_URL: ${{ vars.GITHUB_API_URL }}
          MORAY_API_TYPE: ${{ vars.MORAY_API_TYPE || 'openai' }}
          MORAY_MODEL: ${{ vars.MORAY_MODEL || 'gpt-4o-mini' }}
          MORAY_BASE_URL: ${{ vars.MORAY_BASE_URL || 'https://api.openai.com/v1' }}
          MORAY_API_KEY: ${{ secrets.MORAY_API_KEY }}
          MORAY_TIMEOUT: "120"
          MORAY_BOT_MAX_ATTEMPTS: "3"
          # Optional knobs:
          # MORAY_BOT_BASE_BRANCH: main
          # MORAY_BOT_BRANCH_PREFIX: moray-bot/issue-
          # MORAY_BOT_FAILURE_LABEL: needs-human
          # MORAY_BOT_CLOSE_ISSUE: "false"
          # MORAY_BOT_GIT_NAME: moray-surgeon[bot]
          # MORAY_BOT_GIT_EMAIL: moray-surgeon[bot]@users.noreply.github.com
          # MORAY_MAX_WORKERS: "4"
        run: >-
          moray-surgeon bot
          --issue "${{ github.event.issue.number }}"
          --repo "${{ github.repository }}"
